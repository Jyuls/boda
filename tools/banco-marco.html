<!DOCTYPE html>
<!--
  Banco de pruebas de las flores. Carga la invitación en iframes de distintos
  tamaños para comprobar cómo se llevan las flores decorativas con el texto,
  en las dos posiciones de scroll extremas (arriba y abajo).

  Las flores nuevas viven en dos lugares:
    - ".flor-banda": la banda de flores del borde superior de las tarjetas
      navy (ceremonia, comida y cuenta regresiva), pegada al borde de la
      tarjeta (absolute, top:0). Es decorativa: los paddings de la tarjeta
      hacen que el texto empiece bien abajo, lejos de la banda.
    - ".ornamento__gema": las florcitas de las esquinas recortadas que
      flanquean el rombo del adorno de la portada.

  Lo que se mide:
    - que existan .flor-banda y .ornamento__gema y que ninguna esté clavada a
      la pantalla con position:fixed (la decoración se mueve con la página);
    - cuántos nodos de texto visibles tienen su CENTRO dentro del recto de
      una flor. Ese número tiene que ser cero: es la regla del diseño.
    - que no haya scroll horizontal.

  Uso:  python -m http.server 8000
        node tools/probar-marco.js
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>banco de las flores</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; background: #222; color: #eee; }
  .caso { margin-bottom: 18px; border: 1px solid #555; padding: 6px; }
  .caso > h2 { font-size: 13px; margin: 0 0 6px; color: #9cf; }
  iframe { border: 0; display: block; background: #fff; }
  #salida { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div id="casos"></div>
<div id="salida"></div>

<script>
const TAMANOS = [
  { nombre: 'telefono pequeno',  w: 320, h: 640 },
  { nombre: 'telefono',          w: 390, h: 844 },
  { nombre: 'telefono grande',   w: 414, h: 896 },
  { nombre: 'tablet vertical',   w: 768, h: 1024 },
  { nombre: 'tablet horizontal', w: 1024, h: 768 },
  { nombre: 'escritorio',        w: 1440, h: 900 }
];

const dormir = ms => new Promise(r => setTimeout(r, ms));

/* Los nodos que de verdad llevan letras. Los <span> entran porque algunos
   nombres de invitado están dentro de un span y si no, un choque ahí pasaría
   desapercibido. */
const SELECTOR = 'h1, h2, h3, p, li, dt, dd, a, button, label, span, input, .fila__nombre';

function posicionar(iframe, y) {
  const doc = iframe.contentDocument;
  /* El sitio lleva html { scroll-behavior: smooth }, y en Edge headless el
     scroll suave animado no avanza con el tiempo virtual: el scrollTop se
     queda quieto y no se mide nada. Se fuerza 'auto' sólo para el banco. */
  if (doc.documentElement) doc.documentElement.style.scrollBehavior = 'auto';
  const sc = doc.scrollingElement || doc.documentElement;
  sc.scrollTop = y;
  return sc.scrollTop;
}

function medir(iframe, tam) {
  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;

  const flores = [];
  for (const sel of ['.flor-banda', '.ornamento__gema']) {
    for (const f of doc.querySelectorAll(sel)) {
      const rc = f.getBoundingClientRect();
      const rect = [Math.round(rc.left), Math.round(rc.top), Math.round(rc.width), Math.round(rc.height)];
      flores.push({
        clase: sel.slice(1),
        rect,
        posicion: win.getComputedStyle(f).position,
        visible: rect[1] + rect[3] >= 0 && rect[1] <= win.innerHeight
      });
    }
  }

  const nodos = [];
  for (const n of doc.querySelectorAll(SELECTOR)) {
    const est = win.getComputedStyle(n);
    if (est.display === 'none' || est.visibility === 'hidden') continue;
    if (!n.textContent.trim() && n.tagName !== 'INPUT') continue;

    const c = n.getBoundingClientRect();
    if (c.width === 0 || c.height === 0) continue;
    /* La trampa de bots vive a -9999px a propósito: no cuenta. */
    if (c.bottom < -1000) continue;
    /* Sólo los que están en pantalla en este momento. */
    if (c.bottom < 0 || c.top > win.innerHeight) continue;

    nodos.push({
      nodo: n.className || n.tagName,
      caja: [Math.round(c.left), Math.round(c.top), Math.round(c.width), Math.round(c.height)]
    });
  }

  /* El centro de cada texto, ¿cae dentro del recto de una flor? */
  const bajoFlor = [];
  for (const o of nodos) {
    const cx = o.caja[0] + o.caja[2] / 2;
    const cy = o.caja[1] + o.caja[3] / 2;
    for (const fl of flores) {
      const [x, y, w, h] = fl.rect;
      if (cx >= x && cx <= x + w && cy >= y && cy <= y + h) {
        bajoFlor.push({ nodo: o.nodo, caja: o.caja, flor: fl.clase });
        break;
      }
    }
  }

  return {
    nombre: tam.nombre,
    tam: tam.w + 'x' + tam.h,
    scrollY: win.scrollY,
    docAltura: doc.documentElement.scrollHeight,
    flores: flores.length,
    floresVisibles: flores.filter(f => f.visible).length,
    fijas: flores.filter(f => f.posicion === 'fixed').map(f => f.clase),
    visibles: nodos.length,
    bajoFlor,
    scrollHorizontal: doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1
  };
}

async function correr() {
  const contenedor = document.getElementById('casos');
  const resultados = [];

  for (const tam of TAMANOS) {
    const caja = document.createElement('div');
    caja.className = 'caso';
    caja.innerHTML = '<h2>' + tam.nombre + ' (' + tam.w + 'x' + tam.h + ')</h2>';
    const iframe = document.createElement('iframe');
    iframe.width = tam.w;
    iframe.height = tam.h;
    caja.appendChild(iframe);
    contenedor.appendChild(caja);

    const listo = new Promise(rob => iframe.addEventListener('load', rob, { once: true }));
    iframe.src = '/index.html?t=' + Date.now();
    await listo;
    /* Dejar que las fotos y los scripts terminen de acomodar la página. */
    await dormir(700);

    /* Arriba: la portada, donde viven las gemas del adorno. */
    posicionar(iframe, 0);
    await dormir(250);
    const arriba = medir(iframe, tam);

    /* Abajo: el pie, donde quedan las tarjetas navy y sus bandas de flores. */
    posicionar(iframe, 1e6);
    await dormir(250);
    const abajo = medir(iframe, tam);

    resultados.push(arriba, abajo);
  }

  document.getElementById('salida').textContent =
    'RESULTADO_JSON' + JSON.stringify(resultados) + 'FIN_JSON';
}

correr();
</script>
</body>
</html>
