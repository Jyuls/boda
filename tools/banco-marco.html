<!DOCTYPE html>
<!--
  Banco de pruebas del marco. Carga la invitación en iframes de distintos
  tamaños para comprobar cómo se lleva la guirnalda estática de fondo.png con
  el texto, en las dos posiciones de scroll extremas.

  El marco actual NO es una caja que deba evitar el texto: es la guirnalda
  completa de fondo.png, fija a la pantalla (position:fixed) y por encima de
  todo (z-index:30), y el usuario pidió que se vea siempre aunque la página
  ruede. Eso significa que la guirnalda SÍ cruza texto; no es un fallo, es el
  diseño pedido. Por eso este banco ya no falla: mide y reporta.

  Lo que se mide:
    - que .ventana esté fija y cubra el viewport entero en ambos extremos de
      scroll (si no abrazara las cuatro orillas, el marco se vería recortado);
    - cuántos nodos de texto visibles tienen su CENTRO sobre un pétalo opaco de
      la guirnalda (muestreo del canal alfa de fondo.png reproducir con
      background-size:cover). Ese número es informativo: es el precio que se
      aceptó pagar y conviene verlo, no ignorarlo.

  Uso:  python -m http.server 8000
        node tools/probar-marco.js
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>banco del marco</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; background: #222; color: #eee; }
  .caso { margin-bottom: 18px; border: 1px solid #555; padding: 6px; }
  .caso > h2 { font-size: 13px; margin: 0 0 6px; color: #9cf; }
  iframe { border: 0; display: block; background: #fff; }
  #salida { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div id="casos"></div>
<div id="salida"></div>

<script>
const TAMANOS = [
  { nombre: 'telefono pequeno',  w: 320, h: 640 },
  { nombre: 'telefono',          w: 390, h: 844 },
  { nombre: 'telefono grande',   w: 414, h: 896 },
  { nombre: 'tablet vertical',   w: 768, h: 1024 },
  { nombre: 'tablet horizontal', w: 1024, h: 768 },
  { nombre: 'escritorio',        w: 1440, h: 900 }
];

/* Las mismas medidas que el CSS de fondo.png, para reproducir el cover. */
const FUENTE = { w: 1056, h: 1489 };
const UMBRAL_ALFA = 40; /* más opaco que esto cuenta como pétalo */
/* El "celular en pantallas anchas": la columna de --ancho-celular (26rem) y
   el corte de la @media (30rem). Sólo para saber dónde está la guirnalda. */
const CELULAR_MAX = 480;
const ANCHO_CELULAR = 416;

const dormir = ms => new Promise(r => setTimeout(r, ms));

/* Los nodos que de verdad llevan letras. Los <span> entran porque algunos
   nombres de invitado están dentro de un span y si no, un choque ahí pasaría
   desapercibido. */
const SELECTOR = 'h1, h2, h3, p, li, dt, dd, a, button, label, span, input, .fila__nombre';

/* La guirnalda, lista para muestrear alfa. Se pinta en un canvas del mismo
   tamaño que el iframe (el viewport de la invitación), con el mismo
   escalado de un background center/cover. El resultado se cachea por tamaño. */
const IMG = new Image();
const alfaPorTam = new Map();

function mascaraPara(w, h) {
  const clave = w + 'x' + h;
  let data = alfaPorTam.get(clave);
  if (!data) {
    const escala = Math.max(w / FUENTE.w, h / FUENTE.h);
    const dw = FUENTE.w * escala, dh = FUENTE.h * escala;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(IMG, (w - dw) / 2, (h - dh) / 2, dw, dh);
    data = ctx.getImageData(0, 0, w, h).data;
    alfaPorTam.set(clave, data);
  }
  return data;
}

/* ¿El punto (x,y) del viewport vive sobre un pétalo opaco de la guirnalda?
   La guirnalda no siempre abarca todo: en pantallas anchas está clavada a la
   columna del teléfono (rect r), así que fuera de ese rectángulo no hay
   pétalo que pisar. Dentro, se muestrea el alfa con el mismo cover. */
function sobrePetalo(r, x, y) {
  if (x < r.left || x >= r.right || y < r.top || y >= r.bottom) return false;
  const ovW = Math.round(r.width), ovH = Math.round(r.height);
  const data = mascaraPara(ovW, ovH);
  const escala = Math.max(ovW / FUENTE.w, ovH / FUENTE.h);
  const dw = FUENTE.w * escala, dh = FUENTE.h * escala;
  const sx = Math.round(((x - r.left) - (ovW - dw) / 2) / escala);
  const sy = Math.round(((y - r.top) - (ovH - dh) / 2) / escala);
  if (sx < 0 || sy < 0 || sx >= FUENTE.w || sy >= FUENTE.h) return false;
  return data[((sy * ovW) + sx) * 4 + 3] > UMBRAL_ALFA;
}

function posicionar(iframe, y) {
  const doc = iframe.contentDocument;
  /* El sitio lleva html { scroll-behavior: smooth }, y en Edge headless el
     scroll suave animado no avanza con el tiempo virtual: el scrollTop se
     queda quieto y no se mide nada. Se fuerza 'auto' sólo para el banco. */
  if (doc.documentElement) doc.documentElement.style.scrollBehavior = 'auto';
  const sc = doc.scrollingElement || doc.documentElement;
  sc.scrollTop = y;
  return sc.scrollTop;
}

function medir(iframe, tam) {
  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;

  const vis = doc.querySelector('.ventana');
  const rc = vis ? vis.getBoundingClientRect() : null;

  const nodos = [];
  for (const n of doc.querySelectorAll(SELECTOR)) {
    const est = win.getComputedStyle(n);
    if (est.display === 'none' || est.visibility === 'hidden') continue;
    if (!n.textContent.trim() && n.tagName !== 'INPUT') continue;

    const c = n.getBoundingClientRect();
    if (c.width === 0 || c.height === 0) continue;
    /* La trampa de bots vive a -9999px a propósito: no cuenta. */
    if (c.bottom < -1000) continue;
    /* El marco mismo no se prueba contra sí mismo. */
    if (n.closest('.ventana')) continue;
    /* Sólo los que están en pantalla en este momento. */
    if (c.bottom < 0 || c.top > win.innerHeight) continue;

    nodos.push({
      nodo: n.className || n.tagName,
      caja: [Math.round(c.left), Math.round(c.top), Math.round(c.width), Math.round(c.height)]
    });
  }

  const bajo = nodos.filter(o => {
    const cx = Math.round(o.caja[0] + o.caja[2] / 2);
    const cy = Math.round(o.caja[1] + o.caja[3] / 2);
    return rc ? sobrePetalo(rc, cx, cy) : false;
  });

  const r = {
    nombre: tam.nombre,
    tam: tam.w + 'x' + tam.h,
    scrollY: win.scrollY,
    scrollEl: doc.scrollingElement ? doc.scrollingElement.tagName : 'ninguno',
    docAltura: doc.documentElement.scrollHeight,
    ventana: rc ? {
      x: Math.round(rc.left), y: Math.round(rc.top),
      w: Math.round(rc.width), h: Math.round(rc.height),
      posicion: getComputedStyle(vis).position
    } : null,
    /* El centro horizontal del cuerpo: en pantallas anchas el body es la
       columna de teléfono centrada, y la guirnalda debe estar clavada a ese
       centro (no al del viewport, que incluye el scrollbar). */
    columnaCx: doc.body ? Math.round(doc.body.getBoundingClientRect().left +
      doc.body.getBoundingClientRect().width / 2) : null,
    visibles: nodos.length,
    bajoLaGuirnalda: bajo.length,
    bajo: bajo,
    pieDesde: doc.querySelector('.pie') ? Math.round(doc.querySelector('.pie').getBoundingClientRect().top + win.scrollY) : null,
    secciones: [...doc.querySelectorAll('.portada, .cuenta-marco, #respuesta')].map(el => ({
      clase: String(el.className).split(' ')[0],
      desde: Math.round(el.getBoundingClientRect().top + win.scrollY),
      alto: Math.round(el.getBoundingClientRect().height)
    })),
    scrollHorizontal: doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1
  };
  return r;
}

async function correr() {
  /* La guirnalda debe estar lista antes de medir: esperar su carga. */
  if (!IMG.complete) await new Promise(r => {
    IMG.onload = r;
    IMG.onerror = () => { IMG.complete = false; r(); };
  });

  const contenedor = document.getElementById('casos');
  const resultados = [];

  for (const tam of TAMANOS) {
    const caja = document.createElement('div');
    caja.className = 'caso';
    caja.innerHTML = '<h2>' + tam.nombre + ' (' + tam.w + 'x' + tam.h + ')</h2>';
    const iframe = document.createElement('iframe');
    iframe.width = tam.w;
    iframe.height = tam.h;
    caja.appendChild(iframe);
    contenedor.appendChild(caja);

    const listo = new Promise(rob => iframe.addEventListener('load', rob, { once: true }));
    iframe.src = '/index.html?t=' + Date.now();
    await listo;
    await dormir(700);

    /* Arriba: la portada, donde la guirnalda cruza el primer renglón. */
    posicionar(iframe, 0);
    await dormir(250);
    const arriba = medir(iframe, tam);

    /* Abajo: el pie, donde la guirnalda cruza el último renglón. */
    posicionar(iframe, 1e6);
    await dormir(250);
    const abajo = medir(iframe, tam);

    resultados.push(arriba, abajo);
  }

  document.getElementById('salida').textContent =
    'RESULTADO_JSON' + JSON.stringify(resultados) + 'FIN_JSON';
}

/* Cargar la guirnalda desde ya, para que al llegar el primer `correr()` ya
   esté lista. */
IMG.src = '/assets/img/fondo.png';
correr();
</script>
</body>
</html>
