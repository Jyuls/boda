<!DOCTYPE html>
<!--
  Plantilla de la imagen que se ve al compartir el link en WhatsApp.

  No se publica sola: es un archivo de 1200x630 que hay que exportar a PNG.
  Para regenerarla:

    1. Abrí este archivo en el navegador.
    2. Captura con el tamaño exacto de la ventana: 1200 x 630.
    3. Guardá la captura como assets/img/og.png

  Si no querés depender del navegador, hay una línea de Node que lo hace:

    npx --yes playwright screenshot --viewport-size=1200,630 \
      "http://localhost:8000/tools/og-preview.html" assets/img/og.png

  Recordá cambiar la URL de og:image en index.html por la absoluta cuando
  tengas el dominio, porque los lectores de WhatsApp no siempre resuelven
  rutas relativas.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>og:preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Cormorant Infant', Garamond, Georgia, serif;
    color: #4B3A3F;
    text-align: center;
    background:
      radial-gradient(ellipse 120% 80% at 50% -25%, #F9DDDC 0%, transparent 62%),
      radial-gradient(ellipse 90% 70% at 12% 115%, #E7EDE4 0%, transparent 66%),
      radial-gradient(ellipse 90% 70% at 88% 115%, #F3D9D6 0%, transparent 66%),
      #FBF4EE;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
  }
  .sello { width: 62px; height: auto; color: #B8974F; margin-bottom: 26px; }
  .formula {
    font-size: 21px; font-style: italic; font-weight: 300; line-height: 1.55;
    color: #6B4A5E; opacity: .85; margin: 0 0 30px;
  }
  .nombres { font-size: 74px; font-weight: 300; line-height: 1.12; margin: 0 0 6px; }
  .nombres .y {
    display: block; font-style: italic; font-size: .44em;
    color: #7C4A55; padding: 6px 0 8px; letter-spacing: .06em;
  }
  .regla { display: flex; align-items: center; gap: 14px; margin: 30px 0 22px; color: #EFD9A8; }
  .regla::before, .regla::after {
    content: ""; height: 1px; width: 90px;
    background: linear-gradient(90deg, transparent, rgba(184,151,79,.6));
  }
  .regla::after { background: linear-gradient(90deg, rgba(184,151,79,.6), transparent); }
  .gema { width: 6px; height: 6px; background: #EFD9A8; transform: rotate(45deg); }
  .fecha { font-size: 33px; font-style: italic; font-weight: 300; color: #6B4A5E; margin: 0; }
  .lugar {
    font-family: 'Jost', system-ui, sans-serif;
    font-size: 17px; letter-spacing: .16em; text-transform: uppercase;
    color: #7C4A55; opacity: .8; margin: 16px 0 0;
  }
</style>
</head>
<body>

<svg class="sello" viewBox="0 0 64 84" aria-hidden="true">
  <g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 3v11M26.5 8.5h11"/>
    <path d="M32 17c-4.5 6.5-4.5 12 0 17.5 4.5-5.5 4.5-11 0-17.5Z"/>
    <path d="M20.5 22c-3.4 4.7-3.4 9.2 0 13.8 3.4-4.6 3.4-9.1 0-13.8Z"/>
    <path d="M43.5 22c-3.4 4.7-3.4 9.2 0 13.8 3.4-4.6 3.4-9.1 0-13.8Z"/>
    <path d="M32 80C17 69 10 61 10 52c0-8 6-13 13-13 4.5 0 7.5 3 9 7 1.5-4 4.5-7 9-7 7 0 13 5 13 13 0 9-7 17-22 28Z"/>
  </g>
</svg>

<p class="formula">Con la gracia de Dios y la bendición de la Iglesia,<br>contraen matrimonio</p>

<h1 class="nombres">
  Abril Cristina&nbsp;Carrillo Sánchez
  <span class="y">y</span>
  Johann Ezequiel&nbsp;Vega González
</h1>

<div class="regla"><span class="gema"></span></div>

<p class="fecha">Jueves 22 de octubre de 2026</p>
<p class="lugar">Parroquia San Ignacio de Loyola · Tijuana</p>

</body>
</html>
