<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links de invitación · boda Abril y Johann</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  /* Sencillo a propósito: es una herramienta, no la invitación. */
  body { padding-bottom: 4rem; }
  .herramienta { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.5rem; }
  .herramienta h1 { font-size: 1.7rem; margin-bottom: .3rem; }
  .herramienta__intro { font-size: 1rem; opacity: .7; margin-bottom: 1.8rem; }
  .aviso {
    border-left: 3px solid var(--cera);
    background: var(--rose-claro); padding: .9rem 1.1rem; margin-bottom: 1.8rem;
    font-family: var(--sans); font-size: .86rem; line-height: 1.6;
    border-radius: var(--esquina);
  }
  .filtro {
    width: 100%; padding: .6rem .1rem; border: 0;
    border-bottom: 1px solid rgba(124, 74, 85, .28);
    background: none; font-family: var(--serif); font-size: 1.08rem; color: var(--tinta);
    margin-bottom: 1.6rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 1rem; }
  th {
    text-align: left; font-family: var(--sans); font-size: .72rem; font-weight: 400;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--sagrario); opacity: .75; padding: 0 .6rem .5rem 0;
    border-bottom: 1px solid rgba(184, 151, 79, .45);
  }
  td { padding: .85rem .6rem .85rem 0; border-bottom: 1px solid rgba(124, 74, 85, .09); vertical-align: top; }
  td.link { font-family: var(--sans); font-size: .8rem; word-break: break-all; opacity: .8; }
  td.acciones { white-space: nowrap; }
  .mini {
    font-family: var(--sans); font-size: .76rem; background: none;
    border: 1px solid rgba(124, 74, 85, .25); color: var(--sagrario);
    padding: .28rem .7rem; cursor: pointer; border-radius: var(--esquina);
  }
  .mini:hover { background: var(--sagrario); border-color: var(--sagrario); color: var(--velo); }
  .previa {
    margin: 0; font-family: var(--sans); font-size: .78rem; line-height: 1.55;
    white-space: pre-wrap; opacity: .75; max-width: 22rem;
  }
  .vacío { opacity: .6; font-style: italic; padding: 2rem 0; }
</style>
</head>
<body>
<div class="herramienta">
  <h1>Links de invitación</h1>
  <p class="herramienta__intro">Cada fila es un grupo. Copiá el link para mandarlo por WhatsApp, o el mensaje completo si preferís escribirlo vos.</p>

  <div class="aviso" data-aviso></div>

  <input class="filtro" type="search" placeholder="Filtrar por grupo o nombre" data-filtro>

  <table>
    <thead>
      <tr>
        <th>Invitación</th>
        <th>Personas</th>
        <th>Link</th>
        <th>Copiar link</th>
        <th>Mensaje</th>
      </tr>
    </thead>
    <tbody data-filas></tbody>
  </table>
  <p class="vacío" data-vacio hidden>Nadie coincide con ese filtro.</p>

  <p style="margin-top:2rem">
    <button class="boton boton--discreto" type="button" data-todo>Copiar todos los links</button>
  </p>
</div>

<script src="../assets/js/config.js"></script>
<script src="../data/invitados.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.CONFIG || {};
  var INVITADOS = window.INVITADOS || [];

  /* config.js resuelve la URL del sitio. No se puede armar con CFG.usuario
     pelado: eso es sólo el nombre de usuario y no es una dirección. */
  var base = String(CFG.urlSitio || '').replace(/\/+$/, '');
  var cuerpo = document.querySelector('[data-filas]');
  var filtro = document.querySelector('[data-filtro]');
  var vacio = document.querySelector('[data-vacio]');
  var aviso = document.querySelector('[data-aviso]');

  function planilla() {
    return CFG.boda.fechaLarga + ' a las ' + (CFG.boda.hora || '11:00') + ' en ' + CFG.boda.lugar + '.';
  }

  function mensajeDe(inv) {
    var link = base + '/#' + inv.codigo;
    return 'Con mucho gusto te invitamos a nuestra boda.\n\n' +
      planilla() + '\n\n' +
      'Confirma aquí: ' + link + '\n\n' +
      'Con cariño, Abril y Johann';
  }

  if (!base) {
    aviso.textContent = 'Todavía no se sabe la dirección del sitio, así que los links de abajo no funcionan. Abrí assets/js/config.js y poné tu usuario de GitHub, o escribí urlSitio con la URL completa si el repositorio no se llama "boda".';
    aviso.style.display = 'block';
  } else {
    aviso.style.display = 'none';
  }

  function normalizar(v) {
    return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function pintar() {
    var termino = normalizar(filtro.value);
    cuerpo.textContent = '';

    var visibles = INVITADOS.filter(function (inv) {
      if (!termino) return true;
      return normalizar(inv.grupo).indexOf(termino) !== -1 ||
        (inv.miembros || []).some(function (m) { return normalizar(m).indexOf(termino) !== -1; });
    });

    visibles.forEach(function (inv) {
      var link = base + '/#' + inv.codigo;
      var fila = document.createElement('tr');

      var tdGrupo = document.createElement('td');
      tdGrupo.textContent = inv.grupo;
      tdGrupo.appendChild(document.createElement('br'));
      var cod = document.createElement('span');
      cod.className = 'previa';
      cod.textContent = inv.codigo;
      tdGrupo.appendChild(cod);

      var tdPersonas = document.createElement('td');
      tdPersonas.textContent = (inv.miembros || []).join(', ') || '—';

      var tdLink = document.createElement('td');
      tdLink.className = 'link';
      tdLink.textContent = link;

      var tdAcciones = document.createElement('td');
      tdAcciones.className = 'acciones';
      var btnLink = document.createElement('button');
      btnLink.className = 'mini';
      btnLink.type = 'button';
      btnLink.textContent = 'Copiar link';
      btnLink.addEventListener('click', function () {
        copiar(link, btnLink, 'Link copiado');
      });
      tdAcciones.appendChild(btnLink);

      var tdMsj = document.createElement('td');
      var previa = document.createElement('pre');
      previa.className = 'previa';
      previa.textContent = mensajeDe(inv);
      tdMsj.appendChild(previa);
      var btnMsj = document.createElement('button');
      btnMsj.className = 'mini';
      btnMsj.type = 'button';
      btnMsj.textContent = 'Copiar mensaje';
      btnMsj.style.marginLeft = '.4rem';
      btnMsj.addEventListener('click', function () {
        copiar(mensajeDe(inv), btnMsj, 'Mensaje copiado');
      });
      tdMsj.appendChild(btnMsj);

      fila.appendChild(tdGrupo);
      fila.appendChild(tdPersonas);
      fila.appendChild(tdLink);
      fila.appendChild(tdAcciones);
      fila.appendChild(tdMsj);
      cuerpo.appendChild(fila);
    });

    vacio.hidden = visibles.length > 0;
  }

  function copiar(texto, boton, avisoTexto) {
    var listo = function () {
      var antes = boton.textContent;
      boton.textContent = avisoTexto;
      setTimeout(function () { boton.textContent = antes; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(listo);
      return;
    }
    var area = document.createElement('textarea');
    area.value = texto;
    area.style.position = 'fixed';
    area.style.left = '-9999px';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); listo(); } catch (e) { /* nada */ }
    document.body.removeChild(area);
  }

  document.querySelector('[data-todo]').addEventListener('click', function () {
    var todos = INVITADOS.map(function (inv) { return inv.grupo + '\t' + base + '/#' + inv.codigo; }).join('\n');
    copiar(todos, this, todos.split('\n').length + ' links copiados');
  });

  filtro.addEventListener('input', pintar);
  pintar();
})();
</script>
</body>
</html>
